name = "black-box-behavior-spec-kernel"
description = "Expand source requirements into black-box behavior cases before Codex-first Plan readiness."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Create or update the black-box behavior spec artifact when Codex-first Plan readiness is NeedsPlanBehaviorExpansion.
Use .github/agents/black-box-behavior-spec-kernel.agent.md as the authoritative process contract when it exists in the repository.
Read the user intent, issue text, source requirements, bounded Plan draft, and current codex-first state artifact.
Write only the behavior spec artifact, normally plans/<ticket-or-slug>-black-box-behavior-spec.md, and state-artifact fields needed to record the produced artifact path.
Do not edit production code, tests, runtime contracts, Plan FR/AC, or implementation artifacts.
Every Case ID must trace back to one or more Source IDs. Do not add source-free expected behavior.
Negative expectations are first-class; record "must not", exclusions, deletion prevention, blocked access, or out-of-scope behavior explicitly when source-backed.
Do not mechanically enumerate the full Cartesian product of behavior axes. Expand only source-required cases, behavior-changing boundaries, important state transitions, and negative expectations.
Do not infer undecidable expected behavior or negative expectations. Record unresolved requirement-elaboration items and stop with NeedsHumanDecision when needed.
The behavior spec artifact must use this minimum structure:

# Black-box Behavior Spec

## Scope

## Source requirement inventory

| Source ID | Requirement summary | Kind | Source | Notes |
| --- | --- | --- | --- | --- |

## Behavior axes

| Axis ID | Axis | Relevant values | Why behavior changes | Notes |
| --- | --- | --- | --- | --- |

## Case matrix

| Case ID | Source IDs | Input conditions / preconditions | Expected observable behavior | Negative expectation | Status |
| --- | --- | --- | --- | --- | --- |

## Derived invariants

| Invariant ID | Description | Covered Case IDs | Notes |
| --- | --- | --- | --- |

## Excluded combinations / non-goals

| Exclusion ID | Condition / behavior | Source or reason | Reopen condition |
| --- | --- | --- | --- |

## Unresolved requirement-elaboration items

| Item ID | Source IDs | Missing decision / ambiguity | Blocking? | Required decision |
| --- | --- | --- | --- | --- |

