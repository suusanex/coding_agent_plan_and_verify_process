name: codex-first-ai-development-process
version: 0.5.0
description: Codex-first cost-aware routing package with default Adaptive Implementation, explicit Design Pair pre-stage, stateful resume, tiered delegation, and architecture-gated full-coverage separation
type: hybrid
targets:
  - codex
  - agent-skills
includes: auto

dependencies:
  apm:
    # Shared Plan Coverage guardrails used by repository agent files.
    - git: parent
      path: .github/instructions/plan-coverage-shared.instructions.md
    # Standard cost-aware route kernels.
    - git: parent
      path: .github/agents/plan-kernel.agent.md
    - git: parent
      path: .github/agents/black-box-behavior-spec-kernel.agent.md
    - git: parent
      path: .github/agents/change-risk-triage.agent.md
    - git: parent
      path: .github/agents/architecture-slice-readiness.agent.md
    - git: parent
      path: .github/agents/architecture-elaboration.agent.md
    - git: parent
      path: .github/agents/implementation-contract-kernel.agent.md
    - git: parent
      path: .github/agents/implementation-contract-review-kernel.agent.md
    - git: parent
      path: .github/agents/runtime-contract-kernel.agent.md
    - git: parent
      path: .github/agents/test-design-kernel.agent.md
    - git: parent
      path: .github/agents/implementation-handoff-review.agent.md
    - git: parent
      path: .github/agents/implementation-execution.agent.md
    # Legacy dependency above remains available only for explicit compatibility use.
    - git: parent
      path: apm-packages/design-pair-implementation-execution/.apm/skills/design-pair-implementation-execution
    - git: parent
      path: apm-packages/adaptive-implementation-execution/.apm/skills/adaptive-implementation-execution
    - git: parent
      path: .github/agents/high-implementation-starter.agent.md
    - git: parent
      path: .github/agents/standard-implementation-completer.agent.md
    - git: parent
      path: .github/agents/code-review-focus-kernel.agent.md
    - git: parent
      path: .github/agents/verification-kernel.agent.md
    - git: parent
      path: .github/agents/coverage-gap-triage.agent.md
    - git: parent
      path: .github/agents/residual-decision-gate.agent.md
    - git: parent
      path: .github/agents/coverage-gap-resolution-slice.agent.md
    # Advanced full-coverage route support. These are not the default beginner path.
    - git: parent
      path: .github/agents/plan-slice-decomposition.agent.md
    - git: parent
      path: apm-packages/plan-coverage-residual-flow/.apm/skills/plan-coverage-residual-flow
    - git: parent
      path: .github/agents/cross-slice-verification-kernel.agent.md
    # Compatibility with the existing full-autonomous Plan-first package.
    # The standard Codex-first route does not invoke these by default.
    - git: parent
      path: .github/agents/plan-generation.agent.md
    - git: parent
      path: .github/agents/plan-review.agent.md
    - git: parent
      path: .github/agents/runtime-evidence.agent.md
    - git: parent
      path: .github/agents/integration-test-design.agent.md
    - git: parent
      path: .github/agents/integration-test-verification-implementation.agent.md
    - git: parent
      path: .github/agents/coverage-gap-resolution.agent.md
