name: copilot-fallback-ai-development-process
version: 0.3.0
description: GitHub Copilot Chat fallback package for cost-aware Plan-first routing, HIGH-first Adaptive Implementation, stateful resume, and close gates
type: hybrid
targets:
  - copilot
includes: auto

dependencies:
  apm:
    # Existing kernel agents remain the source of truth for deeper Plan-first flow.
    - git: parent
      path: .github/agents/plan-kernel.agent.md
    - git: parent
      path: .github/agents/black-box-behavior-spec-kernel.agent.md
    - git: parent
      path: .github/agents/change-risk-triage.agent.md
    - git: parent
      path: .github/agents/implementation-handoff-review.agent.md
    - git: parent
      path: apm-packages/adaptive-implementation-execution/.apm/skills/adaptive-implementation-execution
    - git: parent
      path: .github/agents/high-implementation-starter.agent.md
    - git: parent
      path: .github/agents/standard-implementation-completer.agent.md
    - git: parent
      path: .github/agents/implementation-execution.agent.md
    # Legacy dependency above remains available only for explicit compatibility use.
    - git: parent
      path: .github/agents/verification-kernel.agent.md
    - git: parent
      path: .github/agents/residual-decision-gate.agent.md
