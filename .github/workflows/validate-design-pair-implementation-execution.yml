name: Validate Design Pair Implementation Execution

on:
  pull_request:
    paths:
      - 'apm-packages/design-pair-implementation-execution/**'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - '.github/workflows/validate-design-pair-implementation-execution.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'apm-packages/design-pair-implementation-execution/**'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - '.github/workflows/validate-design-pair-implementation-execution.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Design Pair package and integrated contracts
        shell: pwsh
        run: ./apm-packages/design-pair-implementation-execution/scripts/validate.ps1

  validate-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pinned APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.26.0'
      - name: Remote APM install smoke for Design Pair transitive closure
        shell: pwsh
        env:
          PACKAGE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          PACKAGE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_APM_PAT: ${{ github.token }}
        run: |
          ./apm-packages/design-pair-implementation-execution/scripts/validate-dp-apm-smoke.ps1 `
            -Repository $env:PACKAGE_REPOSITORY `
            -Ref $env:PACKAGE_REF
