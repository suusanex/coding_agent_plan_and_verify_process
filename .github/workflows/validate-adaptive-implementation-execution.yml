name: Validate Adaptive Implementation Contracts

on:
  pull_request:
    paths:
      - '.github/agents/high-implementation-starter.agent.md'
      - '.github/agents/standard-implementation-completer.agent.md'
      - '.github/agents/**'
      - '.github/instructions/plan-coverage-shared.instructions.md'
      - '.github/workflows/validate-adaptive-implementation-execution.yml'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'apm-packages/design-pair-implementation-execution/**'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - 'scripts/provision-work-repo-agents.cs'
      - 'docs/**'
      - 'README.md'
  push:
    paths:
      - '.github/agents/high-implementation-starter.agent.md'
      - '.github/agents/standard-implementation-completer.agent.md'
      - '.github/agents/**'
      - '.github/instructions/plan-coverage-shared.instructions.md'
      - '.github/workflows/validate-adaptive-implementation-execution.yml'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'apm-packages/design-pair-implementation-execution/**'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - 'scripts/provision-work-repo-agents.cs'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate-adaptive-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up pinned APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.26.0'
      - name: Validate Adaptive Implementation contracts
        shell: pwsh
        run: ./apm-packages/adaptive-implementation-execution/scripts/validate-adaptive-implementation-execution.ps1
      - name: Validate remote Adaptive package installation
        shell: pwsh
        env:
          PACKAGE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          PACKAGE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_APM_PAT: ${{ github.token }}
        run: |
          ./apm-packages/adaptive-implementation-execution/scripts/validate-adaptive-implementation-apm-smoke.ps1 `
            -Repository $env:PACKAGE_REPOSITORY `
            -Ref $env:PACKAGE_REF
