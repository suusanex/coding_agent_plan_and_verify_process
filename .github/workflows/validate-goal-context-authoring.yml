name: Validate Goal Context Authoring

on:
  pull_request:
    paths:
      - 'apm-packages/goal-context-authoring/**'
      - '.github/workflows/validate-goal-context-authoring.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'apm-packages/goal-context-authoring/**'
      - '.github/workflows/validate-goal-context-authoring.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up APM CLI
        uses: microsoft/apm-action@v1
        with:
          apm-version: '0.26.0'
          setup-only: true
      - name: Validate Goal Context package and fixtures
        shell: pwsh
        run: ./apm-packages/goal-context-authoring/scripts/validate-goal-context-authoring.ps1
      - name: Smoke test package-root installation
        shell: pwsh
        run: ./apm-packages/goal-context-authoring/scripts/test-apm-package-install.ps1
