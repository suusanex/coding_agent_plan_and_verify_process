name: Validate README navigation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/installation-and-maintenance.md'
      - 'apps/CodexLocalInbox/README.md'
      - 'scripts/codex-notification-runtime/README.md'
      - 'apm-packages/*/README.md'
      - 'scripts/validate-readme-navigation.ps1'
      - '.github/workflows/validate-readme-navigation.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'docs/installation-and-maintenance.md'
      - 'apps/CodexLocalInbox/README.md'
      - 'scripts/codex-notification-runtime/README.md'
      - 'apm-packages/*/README.md'
      - 'scripts/validate-readme-navigation.ps1'
      - '.github/workflows/validate-readme-navigation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate navigation and relative links
        shell: pwsh
        run: ./scripts/validate-readme-navigation.ps1
