name: Validate README navigation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate navigation and relative links
        shell: pwsh
        run: ./scripts/validate-readme-navigation.ps1
