name: Validate PR Review Remediation

on:
  pull_request:
    paths:
      - '.github/agents/local-reviewer.agent.md'
      - '.github/agents/review-planner.agent.md'
      - '.github/agents/high-implementation-starter.agent.md'
      - '.github/agents/standard-implementation-completer.agent.md'
      - '.github/workflows/validate-pr-review-remediation.yml'
      - 'apm-packages/pr-review-remediation/**'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'README.md'
  push:
    paths:
      - '.github/agents/local-reviewer.agent.md'
      - '.github/agents/review-planner.agent.md'
      - '.github/agents/high-implementation-starter.agent.md'
      - '.github/agents/standard-implementation-completer.agent.md'
      - '.github/workflows/validate-pr-review-remediation.yml'
      - 'apm-packages/pr-review-remediation/**'
      - 'apm-packages/adaptive-implementation-execution/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate-pr-review-remediation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR Review Remediation contracts and fixtures
        shell: pwsh
        run: ./apm-packages/pr-review-remediation/scripts/validate-pr-review-remediation.ps1

  validate-pr-review-remediation-apm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install APM CLI for remote package smoke
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.26.0'
      - name: Validate remote package installation and relative assets
        shell: pwsh
        env:
          GITHUB_APM_PAT: ${{ github.token }}
          PACKAGE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PACKAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./apm-packages/pr-review-remediation/scripts/validate-pr-review-remediation-apm-smoke.ps1 -Repository $env:PACKAGE_REPOSITORY -Ref $env:PACKAGE_REF
