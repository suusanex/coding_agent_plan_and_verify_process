name: Validate Plan Coverage Residual Flow

on:
  pull_request:
    paths:
      - '.github/workflows/validate-plan-coverage-residual-flow.yml'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - 'docs/plan-coverage-process-and-agents.md'
      - 'docs/plan-coverage-purpose.md'
      - 'docs/plan-coverage-runtime-qualification.md'
      - 'docs/plan-coverage-agent-plugin-poc.md'
      - 'docs/agent-plugin-adoption-strategy.md'
      - 'docs/token-aware-full-coverage-decomposition-flow.md'
      - 'docs/architecture-slice-readiness-validation.md'
      - 'docs/architecture-slice-readiness-validation-result.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-plan-coverage-residual-flow.yml'
      - 'apm-packages/plan-coverage-residual-flow/**'
      - 'docs/plan-coverage-process-and-agents.md'
      - 'docs/plan-coverage-purpose.md'
      - 'docs/plan-coverage-runtime-qualification.md'
      - 'docs/plan-coverage-agent-plugin-poc.md'
      - 'docs/agent-plugin-adoption-strategy.md'
      - 'docs/token-aware-full-coverage-decomposition-flow.md'
      - 'docs/architecture-slice-readiness-validation.md'
      - 'docs/architecture-slice-readiness-validation-result.md'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      plan_e2e: ${{ steps.scope.outputs.plan_e2e }}
      plan_runtime_evidence: ${{ steps.scope.outputs.plan_runtime_evidence }}
      plan_plugin_poc: ${{ steps.scope.outputs.plan_plugin_poc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate scope classification
        shell: pwsh
        run: dotnet run --file ./scripts/validate-process-package-boundaries.cs -- self-test
      - id: scope
        name: Resolve Plan Coverage validation scope
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          dotnet run --file ./scripts/validate-process-package-boundaries.cs -- scope
          --base $env:BASE_SHA
          --head $env:HEAD_SHA
          --github-output $env:GITHUB_OUTPUT

  validate-package-contract:
    needs: classify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate invocation authorization contract
        shell: pwsh
        run: ./apm-packages/plan-coverage-residual-flow/scripts/validate-plan-coverage-residual-flow.ps1
      - name: Check branch or PR whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $zeroSha = '0000000000000000000000000000000000000000'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:BASE_SHA) {
            git diff --check "$env:BASE_SHA...HEAD"
          }
          elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -ne $zeroSha) {
            git cat-file -e "$($env:BEFORE_SHA)^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git diff --check "$env:BEFORE_SHA...HEAD"
            }
            else {
              git show --check --format= HEAD
            }
          }
          else {
            git show --check --format= HEAD
          }

  validate-full-coverage-e2e:
    needs: classify
    if: needs.classify.outputs.plan_e2e == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone full-coverage lifecycle
        shell: pwsh
        run: ./apm-packages/plan-coverage-residual-flow/scripts/validate-plan-coverage-full-coverage-e2e.ps1

  validate-runtime-evidence:
    needs: classify
    if: needs.classify.outputs.plan_runtime_evidence == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed runtime qualification evidence contract
        shell: pwsh
        run: ./apm-packages/plan-coverage-residual-flow/scripts/test-plan-coverage-runtime-qualification-validator.ps1

  validate-agent-plugin-poc:
    needs: classify
    if: needs.classify.outputs.plan_plugin_poc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pinned APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.26.0'
      - name: Validate deterministic Agent Plugins bundle, provenance, and PoC contracts
        shell: pwsh
        run: ./apm-packages/plan-coverage-residual-flow/scripts/validate-plan-coverage-agent-plugin.ps1
