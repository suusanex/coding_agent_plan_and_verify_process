name: Validate Completion Notification Decorator

on:
  pull_request:
    paths:
      - 'apm-packages/completion-notification-decorator/**'
      - 'scripts/codex-notification-runtime/**'
      - '.github/workflows/validate-completion-notification-decorator.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'apm-packages/completion-notification-decorator/**'
      - 'scripts/codex-notification-runtime/**'
      - '.github/workflows/validate-completion-notification-decorator.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up APM CLI
        uses: microsoft/apm-action@v1
        with:
          apm-version: '0.26.0'
          setup-only: true
      - name: Validate decorator and integration fixtures
        shell: pwsh
        run: ./apm-packages/completion-notification-decorator/scripts/validate-completion-notification-decorator.ps1
      - name: Smoke test package-root installation
        shell: pwsh
        run: ./apm-packages/completion-notification-decorator/scripts/test-apm-package-install.ps1
