# この repository で Codex を使うときの推奨 project config です。
# 親エージェントは広い設計整合を見るため、既定では GPT-5.5 / high reasoning を使います。
model = "gpt-5.5"
model_reasoning_effort = "high"

[agents]
# full-coverage decomposition では、slice を無制限に並列化しないでください。
# 親エージェント + slice-prep / slice-impl を想定し、最大3スレッド程度に抑えます。
max_threads = 3

# サブエージェントがさらにサブエージェントを起動する再帰的 fan-out を避けます。
max_depth = 1
